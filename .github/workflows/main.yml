name: Auto Video Downloader

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install https://github.com/yt-dlp/yt-dlp/archive/master.zip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Downloader
        env:
          # CRITICAL UPDATE: Using OAuth Secret now
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
        run: python youtube_to_drive.py

      - name: Commit History
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add download_history.txt || true
          git commit -m "Update download history" || echo "No changes to commit"
          git push
